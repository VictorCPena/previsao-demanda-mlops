services:
  forecast:
    build: .
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - ./work:/app/work:ro
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DEMAND_WORKSPACE: /app/work
      MLFLOW_ENABLE_TELEMETRY: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)).get('model_ready') else 1)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: "no"
